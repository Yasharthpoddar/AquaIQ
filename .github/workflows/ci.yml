name: AquaIQ CI Pipeline

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-test:
    name: Python 3.13 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Require matching private regression assets
        run: python -B -m scripts.check_validation_assets
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check Python source syntax
        run: python -m compileall -q api db data_ingestion models preprocessing scripts tests
      - name: Run database-independent regression suite
        run: python -m pytest -v -m 'not requires_db'

  schema-smoke:
    name: PostgreSQL Schema Migration Smoke Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aquaiq_ci
          POSTGRES_USER: aquaiq_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: aquaiq_ci
      POSTGRES_USER: aquaiq_ci
      POSTGRES_PASSWORD: local_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install regression dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Initialize schema twice and verify migration idempotence
        run: |
          python -m db.init_db
          python -m db.init_db
          python - <<'PY'
          from db.connection import get_connection
          connection = get_connection()
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT version FROM schema_migrations ORDER BY version")
                  assert cursor.fetchall() == [
                      ('003_pipeline_provenance',),
                      ('004_xgboost_forecast_storage',),
                      ('005_scoring_storage',),
                  ]
                  expected = {
                      'features': {'is_observed', 'is_imputed', 'months_since_observation', 'feature_generation'},
                      'predictions': {'run_id', 'origin_date', 'as_of_date', 'model_version', 'feature_generation'},
                      'crisis_scores': {'run_id', 'last_observed_date', 'feature_generation', 'model_version'},
                      'scoring_runs': {'run_id', 'as_of', 'model_sha256', 'district_count', 'status', 'scoring_signature'},
                      'forecast_generations': {'generation_id', 'status', 'as_of', 'horizon_months', 'model_sha256', 'model_card_sha256', 'feature_generation_id', 'feature_data_sha256', 'generation_signature'},
                      'district_forecast_records': {'generation_id', 'district_id', 'status', 'payload_json'},
                      'district_forecast_horizons': {'generation_id', 'district_id', 'horizon', 'target_date', 'predicted_gwl'},
                      'state_forecast_records': {'generation_id', 'state_id', 'status', 'payload_json'},
                      'state_forecast_horizons': {'generation_id', 'state_id', 'horizon', 'target_date', 'predicted_gwl'},
                      'nationwide_summary_records': {'generation_id', 'as_of', 'payload_json'},
                  }
                  for table, columns in expected.items():
                      cursor.execute("SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name=%s", (table,))
                      assert columns <= {row[0] for row in cursor.fetchall()}, table
                  cursor.execute("SELECT indexdef FROM pg_indexes WHERE schemaname='public' AND indexname='idx_predictions_run_identity'")
                  assert 'UNIQUE' in cursor.fetchone()[0]
                  cursor.execute("SELECT count(*) FROM pg_constraint WHERE conrelid='crisis_scores'::regclass AND contype='f'")
                  assert cursor.fetchone()[0] >= 2
                  cursor.execute("SELECT count(*) FROM pg_constraint WHERE conrelid='predictions'::regclass AND contype='f'")
                  assert cursor.fetchone()[0] >= 2
                  cursor.execute("SELECT indexdef FROM pg_indexes WHERE schemaname='public' AND indexname='idx_unique_published_generation'")
                  published_index = cursor.fetchone()[0]
                  assert 'UNIQUE' in published_index and "'published'::text" in published_index
                  for table in ('district_forecast_records', 'district_forecast_horizons', 'state_forecast_records', 'state_forecast_horizons', 'nationwide_summary_records'):
                      cursor.execute("SELECT count(*) FROM pg_constraint WHERE conrelid=%s::regclass AND confrelid='forecast_generations'::regclass AND contype='f'", (table,))
                      assert cursor.fetchone()[0] == 1, table
                  for table in ('crisis_scores', 'predictions'):
                      cursor.execute("SELECT count(*) FROM pg_constraint WHERE conrelid=%s::regclass AND confrelid='scoring_runs'::regclass AND contype='f'", (table,))
                      assert cursor.fetchone()[0] == 1, table
          finally:
              connection.close()
          print('Repeated initialization, exact 003/004/005 versions, forecast/scoring tables, unique indexes and foreign keys verified.')
          PY
      - name: Exercise canonical migration safety in isolated PostgreSQL namespaces
        run: python -m pytest --integration -v tests/test_migration_safety.py

  dashboard-build:
    name: React Dashboard Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dashboard dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Test API request sharing and retries
        run: npm test
      - name: Build dashboard
        run: npm run build
