project:
  name: AquaIQ
  version: '1.0'
  seed: 42
paths:
  data_raw: data/raw
  data_processed: data/processed
  postgres_db: aquaiq
  model_checkpoints: models/checkpoints
  xgboost_checkpoint: models/checkpoints/aquaiq_xgb.json
  geojson_boundaries: data/raw/india_districts.geojson
data_sources:
  cgwb:
    name: Central Ground Water Board
    portal: https://india-wris.nrsc.gov.in
    metric: groundwater_level
  imd:
    name: India Meteorological Department
    portal: https://imdpune.gov.in
    metric: rainfall
  era5:
    name: ECMWF Reanalysis v5
    api: cds.climate.copernicus.eu
    metrics:
    - temperature
    - evapotranspiration
  geojson_source: datameet.org
date_range:
  start: '2002-01-01'
  end: '2024-12-31'
  train_end: '2019-12-31'
  val_end: '2022-12-31'
  test_start: '2023-01-01'
features:
- GWL_current
- GWL_lag_3mo
- GWL_lag_6mo
- rainfall_current
- rainfall_3mo_avg
- monsoon_deficit_pct
- temperature
- evapotranspiration
- water_balance_proxy
- crop_season_flag
model_hyperparameters:
  linear_regression:
    train_years:
    - 2002
    - 2019
    test_years:
    - 2023
    - 2024
  fuzzy_logic:
    inputs:
    - rainfall_deficit
    - depletion_rate
    rainfall_deficit_bins:
    - low
    - medium
    - high
    depletion_rate_bins:
    - stable
    - moderate
    - severe
    rule_count: 9
  perceptron:
    hidden_layers:
    - 64
    activation: relu
    optimizer: adam
    input_size: 10
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.01
    subsample: 0.8
    random_state: 42
  ensemble:
    initial_weights:
      linear_regression_trend: 0.45
      xgboost_risk: 0.35
      drought_frequency: 0.2
    drought_frequency_percentile: 20
    fitted_weights: &id001
      linear_regression_trend: -0.0826
      xgboost_risk: 0.9584
      drought_frequency: 0.1243
crisis_score:
  tiers:
    safe:
    - 0
    - 30
    watch:
    - 31
    - 60
    warning:
    - 61
    - 80
    crisis:
    - 81
    - 100
  alert_threshold: 80
  data_readiness_min_pct: 60
  fallback_strategy:
    step_1: zone_fallback
    step_2: insufficient_data
    min_months_required: 24
api:
  host: 0.0.0.0
  port: 5000
  cors_origins:
  - http://localhost:3000
  cache_days: 7
testing:
  min_coverage_pct: 70
  sample_districts: 10
  backtest_years:
  - 2015
  - 2016
  - 2018
  - 2019
backtest_results:
  ensemble_weights: *id001
  walkforward_validation:
  - fold: train->2020
    n_train: 10800
    n_test: 600
    rmse: 0.9367
    r2: 0.9635
    nse: 0.9635
  - fold: train->2021
    n_train: 11400
    n_test: 600
    rmse: 0.9596
    r2: 0.9616
    nse: 0.9616
  - fold: train->2022
    n_train: 12000
    n_test: 600
    rmse: 0.9266
    r2: 0.9638
    nse: 0.9638
  - fold: train->2023
    n_train: 12600
    n_test: 600
    rmse: 0.9386
    r2: 0.9641
    nse: 0.9641
  - fold: held-out 2023-2024
    n_train: 12600
    n_test: 900
    rmse: 0.9229
    r2: 0.9648
    nse: 0.9648
