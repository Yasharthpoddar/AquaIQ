name: aquaiq
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PYTHON_IMAGE: ${AQUAIQ_PYTHON_IMAGE:-python:3.13.15-slim}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?Set the host of the restored existing PostgreSQL database}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-aquaiq}
      POSTGRES_USER: ${POSTGRES_USER:?Set a read-only serving database role}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the serving database password}
      SECRET_KEY: ${SECRET_KEY:?Set a private randomly generated application secret}
      AQUAIQ_CORS_ORIGINS: ""
      AQUAIQ_EXPECTED_DISTRICTS: ${AQUAIQ_EXPECTED_DISTRICTS:-725}
      AQUAIQ_STATE_MEDIAN_SCHEMA: ${AQUAIQ_STATE_MEDIAN_SCHEMA:-public}
      AQUAIQ_REQUIRE_STATE_MEDIAN_RELEASE: ${AQUAIQ_REQUIRE_STATE_MEDIAN_RELEASE:-true}
      AQUAIQ_STATE_MEDIAN_ARTIFACT_DIR: ${AQUAIQ_STATE_MEDIAN_ARTIFACT_DIR:?Set the exact image-relative median release directory}
      AQUAIQ_STATE_MEDIAN_EXPECTED_RELEASE: ${AQUAIQ_STATE_MEDIAN_EXPECTED_RELEASE:?Set the exact median artifact release}
      AQUAIQ_STATE_MEDIAN_MANIFEST_SHA256: ${AQUAIQ_STATE_MEDIAN_MANIFEST_SHA256:?Set the verified median manifest SHA-256}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${AQUAIQ_DATA_DIR:?Set an absolute path to the matching data directory}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AQUAIQ_CHECKPOINT_DIR:?Set an absolute path to matching models/checkpoints}
        target: /app/models/checkpoints
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=20)"]
      interval: 60s
      timeout: 25s
      start_period: 90s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_STATE_FORECAST_MODE: ${VITE_STATE_FORECAST_MODE:-median}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AQUAIQ_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
