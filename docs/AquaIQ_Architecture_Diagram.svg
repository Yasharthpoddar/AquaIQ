<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1330" viewBox="0 0 1150 1330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/>
    </marker>
    <linearGradient id="ensembleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>

  <rect width="1150" height="1260" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="575" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">AquaIQ — System Architecture</text>
  <text x="575" y="60" text-anchor="middle" font-size="13" fill="#64748B">Groundwater Depletion Forecasting · SIH25068 (Ministry of Jal Shakti)</text>

  <!-- Legend -->
  <rect x="330" y="72" width="16" height="16" rx="3" fill="none" stroke="#0D9488" stroke-width="2"/>
  <text x="352" y="85" font-size="12" fill="#334155">solid border = Core layer (SPIT Sem I–V syllabus)</text>
  <rect x="700" y="72" width="16" height="16" rx="3" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="722" y="85" font-size="12" fill="#334155">dashed border = Advanced layer (self-study extension)</text>

  <!-- LAYER 1: Data Sources -->
  <text x="70" y="112" font-size="12" font-weight="700" fill="#1E3A8A" letter-spacing="1">LAYER 1 — DATA SOURCES</text>
  <g>
    <rect x="70" y="120" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="220" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">CGWB</text>
    <text x="220" y="170" text-anchor="middle" font-size="11" fill="#3B5578">india-wris.nrsc.gov.in</text>
    <text x="220" y="187" text-anchor="middle" font-size="11" fill="#3B5578">~15,000 borewells · GWL readings</text>
  </g>
  <g>
    <rect x="400" y="120" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="550" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">IMD</text>
    <text x="550" y="170" text-anchor="middle" font-size="11" fill="#3B5578">imdpune.gov.in</text>
    <text x="550" y="187" text-anchor="middle" font-size="11" fill="#3B5578">Monthly rainfall + 30yr normal</text>
  </g>
  <g>
    <rect x="730" y="120" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="880" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">ERA5</text>
    <text x="880" y="170" text-anchor="middle" font-size="11" fill="#3B5578">cds.climate.copernicus.eu</text>
    <text x="880" y="187" text-anchor="middle" font-size="11" fill="#3B5578">Temperature + evapotranspiration</text>
  </g>

  <!-- merge arrows into preprocessing -->
  <path d="M220,210 L550,238" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M880,210 L550,238" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M550,210 L550,244" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 2: Preprocessing -->
  <text x="70" y="262" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">LAYER 2 — PREPROCESSING</text>
  <rect x="70" y="270" width="960" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="550" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Preprocessing</text>
  <text x="550" y="320" text-anchor="middle" font-size="12" fill="#475569">Interpolation + SARIMA gap-fill  →  MinMaxScaler  →  10 engineered features</text>

  <path d="M550,340 L550,375" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 3: Core ML container -->
  <text x="70" y="393" font-size="12" font-weight="700" fill="#0D9488" letter-spacing="1">LAYER 3 — CORE ML</text>
  <rect x="55" y="400" width="990" height="180" rx="14" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5"/>
  <rect x="70" y="415" width="300" height="30" rx="15" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
  <text x="220" y="435" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0D9488">CORE — Sem I–V syllabus (guaranteed-safe)</text>

  <rect x="70" y="460" width="290" height="105" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="215" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Linear Regression</text>
  <text x="215" y="510" text-anchor="middle" font-size="11" fill="#475569">Trend estimation</text>
  <text x="215" y="527" text-anchor="middle" font-size="10.5" fill="#0D9488">AS202 · CS205</text>

  <rect x="405" y="460" width="290" height="105" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="550" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Fuzzy Logic</text>
  <text x="550" y="510" text-anchor="middle" font-size="11" fill="#475569">Crisis Score inference</text>
  <text x="550" y="527" text-anchor="middle" font-size="10.5" fill="#0D9488">CS303</text>

  <rect x="740" y="460" width="290" height="105" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="885" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">Perceptron ANN</text>
  <text x="885" y="510" text-anchor="middle" font-size="11" fill="#475569">Risk-tier classification</text>
  <text x="885" y="527" text-anchor="middle" font-size="10.5" fill="#0D9488">CS303</text>

  <path d="M550,580 L550,613" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 4: Advanced ML container -->
  <text x="70" y="631" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="1">LAYER 4 — ADVANCED ML</text>
  <rect x="55" y="638" width="990" height="180" rx="14" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7,5"/>
  <rect x="70" y="653" width="440" height="30" rx="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="290" y="673" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7C3AED">ADVANCED — self-study extension (Sem VI/VII content)</text>

  <rect x="70" y="698" width="450" height="105" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="295" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">PyTorch LSTM</text>
  <text x="295" y="748" text-anchor="middle" font-size="11" fill="#475569">3-layer · hidden=128 · 4-head attention</text>
  <text x="295" y="765" text-anchor="middle" font-size="10.5" fill="#7C3AED">CS321 (Sem VI)</text>

  <rect x="580" y="698" width="450" height="105" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="805" y="728" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">XGBoost + SHAP</text>
  <text x="805" y="748" text-anchor="middle" font-size="11" fill="#475569">500 trees + explainability</text>
  <text x="805" y="765" text-anchor="middle" font-size="10.5" fill="#7C3AED">CS307 (Sem VI) · CS424 (Sem VII)</text>

  <!-- side path: drought frequency straight from CGWB -->
  <path d="M370,150 L370,100 L1090,100 L1090,850 L1035,850" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="1097" y="500" font-size="10.5" fill="#1E3A8A" transform="rotate(90,1097,500)" text-anchor="middle">drought frequency — computed directly from CGWB history, no new source</text>

  <path d="M550,818 L550,850" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 5: Ensemble / Crisis Score -->
  <text x="70" y="868" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="1">LAYER 5 — ENSEMBLE (CRISIS SCORE)</text>
  <rect x="70" y="876" width="960" height="140" rx="12" fill="url(#ensembleGrad)" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="550" y="905" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">AquaIQ Crisis Score</text>
  <text x="550" y="926" text-anchor="middle" font-size="12" fill="#334155">= LSTM forecast + XGBoost risk + Drought frequency (% months below district's 20th percentile GWL)</text>

  <rect x="100" y="945" width="200" height="45" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="200" y="964" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Safe</text>
  <text x="200" y="980" text-anchor="middle" font-size="10.5" fill="#166534">0 – 30</text>

  <rect x="320" y="945" width="200" height="45" rx="8" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="420" y="964" text-anchor="middle" font-size="12" font-weight="700" fill="#854D0E">Watch</text>
  <text x="420" y="980" text-anchor="middle" font-size="10.5" fill="#854D0E">31 – 60</text>

  <rect x="540" y="945" width="200" height="45" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
  <text x="640" y="964" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">Warning</text>
  <text x="640" y="980" text-anchor="middle" font-size="10.5" fill="#9A3412">61 – 80</text>

  <rect x="760" y="945" width="200" height="45" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="860" y="964" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">Crisis</text>
  <text x="860" y="980" text-anchor="middle" font-size="10.5" fill="#991B1B">81 – 100</text>

  <path d="M550,1016 L550,1048" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 6: Flask API -->
  <text x="70" y="1066" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">LAYER 6 — FLASK REST API</text>
  <rect x="70" y="1074" width="960" height="90" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
  <text x="550" y="1100" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Flask REST API — 6 endpoints</text>
  <text x="550" y="1122" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#475569">/predict/{district_id}   /district/{district_id}   /shap/{district_id}</text>
  <text x="550" y="1140" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#475569">/history/{district_id}   /alerts   /simulate (POST)</text>

  <path d="M550,1164 L550,1196" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- LAYER 7: Dashboard -->
  <text x="70" y="1214" font-size="12" font-weight="700" fill="#0891B2" letter-spacing="1">LAYER 7 — REACT DASHBOARD</text>
  <rect x="70" y="1222" width="960" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="550" y="1252" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">React Dashboard</text>
  <text x="550" y="1274" text-anchor="middle" font-size="11.5" fill="#475569">Leaflet.js choropleth map (GeoJSON, datameet.org)  ·  Recharts forecast timeline  ·  Tailwind CSS</text>

  <!-- Footer -->
  <text x="575" y="1320" text-anchor="middle" font-size="11" fill="#94A3B8">AquaIQ — B.Tech CSE, SPIT Mumbai · TE Sem V Mini Project I, AY 2026–27</text>

</svg>
