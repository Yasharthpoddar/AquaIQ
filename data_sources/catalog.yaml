  downloaded_at_utc: '2026-10-25T22:45:40.327326+00:00'
  status:
    discovered: true
    accessible: true
    downloaded: true
    parsed: true
    integrated: false
    validated: false
  decision: Retain quarantined source records. RL_MSL is not sensor/reference metadata. No blanket sign flip, RL_MSL
    subtraction or manual/telemetry pooling.
  blockers: &id001
  - Provider telemetry values are predominantly negative while the deployed target is positive depth below ground
    level. Dataset title and general description do not certify a per-well sign convention or reference datum.
  - No independently certified cross-product well identifiers/aquifer/construction continuity. Exact name+coordinate
    overlap is reported but cannot establish equivalence.
  - Six-hourly readings require station-balanced temporal aggregation and overlap validation before modeling; no
    manual/telemetry pooling performed.
  stations: 68
  negative_rows: 152135
  zero_rows: 45
  positive_rows: 8679
  missing_elevation_rows: 0
  zero_elevation_rows: 2166
  positive_elevation_rows: 158693
  validation_scope: Parsed source units/sign/elevation profile only; per-well datum and export sign not certified,
    so measured m_bgl target conversion is not validated.
  review_evidence: reports/final_release_20261026/groundwater_sources.json
  release_requirements: &id002
  - Provider-certified per-well exported variable, sign convention and units.
  - Stable well identifiers and installation/reference-elevation, sensor-depth and cable-length metadata.
  - Manual dip calibration/correction and maintenance/clock logs, with sufficient independently accepted overlap.
  - Station-balanced temporal aggregation, quality flags and a prospective verification period.
